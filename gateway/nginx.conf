# Monitoring gateway: the only published entry point to Grafana, Prometheus
# and the RabbitMQ UI. Every request is checked by the Python auth-service
# via auth_request before it is proxied.
#
#   /auth/login, /auth/logout   login page and logout (public)
#   /grafana/                   any signed-in user (Grafana role from our role)
#   /prometheus/, /rabbitmq/    admin only

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # Relative Location headers: nginx listens on :80 inside the container but is
    # published on :8080, so absolute redirects would point at the wrong port.
    absolute_redirect off;

    # Resolve service names through Docker's DNS on every request (cached 10 s) instead of
    # once at startup: a recreated container gets a new IP, and a startup-time lookup
    # would keep proxying to the old one. proxy_pass with a variable enables this.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------------------------------------------------------- auth subrequests
    location = /_auth {
        internal;
        set $auth_upstream http://auth-service:8000;
        proxy_pass $auth_upstream/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /_auth_admin {
        internal;
        set $auth_upstream http://auth-service:8000;
        proxy_pass $auth_upstream/verify?role=admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @login {
        return 302 /auth/login?next=$request_uri;
    }

    location @forbidden {
        return 302 /auth/forbidden;
    }

    # ---------------------------------------------------------- public auth pages
    # Only these paths of auth-service are exposed; /verify and /metrics stay internal.
    location ~ ^/auth/(?<auth_page>login|logout|forbidden)$ {
        set $auth_upstream http://auth-service:8000;
        proxy_pass $auth_upstream/$auth_page$is_args$args;
    }

    location = / {
        return 302 /grafana/;
    }

    # ---------------------------------------------------------- Grafana (any user)
    location /grafana/ {
        auth_request /_auth;
        auth_request_set $auth_user    $upstream_http_x_auth_user;
        auth_request_set $grafana_role $upstream_http_x_grafana_role;
        error_page 401 = @login;

        # Grafana trusts these headers (auth.proxy); it is not reachable any other way.
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header Upgrade        $http_upgrade;
        proxy_set_header Connection     $connection_upgrade;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
    }

    # ---------------------------------------------------------- Prometheus (admin)
    location /prometheus/ {
        auth_request /_auth_admin;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        # `set` must precede `rewrite ... break`: break stops later rewrite-module directives.
        set $prometheus_upstream http://prometheus:9090;
        # Strip the /prometheus prefix (Prometheus itself serves from /).
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $prometheus_upstream;
    }

    # ---------------------------------------------------------- RabbitMQ UI (admin)
    location /rabbitmq/ {
        auth_request /_auth_admin;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        # No URI part: the raw path (with %2F vhost) is passed through untouched.
        set $rabbitmq_upstream http://rabbitmq:15672;
        proxy_pass $rabbitmq_upstream;
    }
}
